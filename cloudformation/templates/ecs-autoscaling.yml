AWSTemplateFormatVersion: 2010-09-09
Description: Simple ECS Service Autoscaling with configurable metrics

Parameters:
  ServiceStackName:
    Type: String
    MinLength: "1"
    MaxLength: "255"
    AllowedPattern: ^[a-zA-Z][-a-zA-Z0-9]*$
    Description: Name of the CloudFormation stack that created the ECS service
  MinCapacity:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Minimum number of tasks
  MaxCapacity:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Maximum number of tasks
  CPUTargetValue:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
    Description: Target CPU utilization percentage (only used if CPUTargetValue is greater than 0)
  MaxCPUTargetValue:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
    Description: Target Max CPU utilization percentage (only used if MaxCPUTargetValue is greater than 0)
  MaxCPUStepScalingAdjustment:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 5
    Description: Number of tasks to add when max CPU step scaling is triggered
  MemoryTargetValue:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 100
    Description: Target memory utilization percentage (only used if MemoryTargetValue is greater than 0)
  ScaleInCooldown:
    Type: Number
    Default: 300
    MinValue: 0
    Description: Cooldown period (in seconds) after a scale-in activity
  ScaleOutCooldown:
    Type: Number
    Default: 60
    MinValue: 0
    Description: Cooldown period (in seconds) after a scale-out activity

Conditions:
  ShouldEnableCPUScaling: !Not [!Equals [!Ref CPUTargetValue, 0]]
  ShouldEnableMaxCPUScaling: !Not [!Equals [!Ref MaxCPUTargetValue, 0]]
  ShouldEnableMemoryScaling: !Not [!Equals [!Ref MemoryTargetValue, 0]]

Resources:
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxCapacity
      MinCapacity: !Ref MinCapacity
      ResourceId: !Sub
        - service/${ClusterName}/${ServiceName}
        - ClusterName: !ImportValue
            Fn::Sub: ${ServiceStackName}-ClusterName
          ServiceName: !ImportValue
            Fn::Sub: ${ServiceStackName}-ECSServiceName
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  CPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ShouldEnableCPUScaling
    Properties:
      PolicyName: !Sub
        - ${ServiceName}-cpu-scaling
        - ServiceName: !ImportValue
            Fn::Sub: ${ServiceStackName}-ECSServiceName
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CPUTargetValue
        ScaleInCooldown: !Ref ScaleInCooldown
        ScaleOutCooldown: !Ref ScaleOutCooldown

  MaxCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: ShouldEnableMaxCPUScaling
    Properties:
      AlarmName: !Sub
        - ${ServiceName}-max-cpu-alarm
        - ServiceName: !ImportValue
            Fn::Sub: ${ServiceStackName}-ECSServiceName
      AlarmDescription: Triggers step scaling when max CPU utilization reaches threshold
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !ImportValue
            Fn::Sub: ${ServiceStackName}-ClusterName
        - Name: ServiceName
          Value: !ImportValue
            Fn::Sub: ${ServiceStackName}-ECSServiceName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: !Ref MaxCPUTargetValue
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref MaxCPUScalingPolicy

  MaxCPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ShouldEnableMaxCPUScaling
    Properties:
      PolicyName: !Sub
        - ${ServiceName}-max-cpu-scaling
        - ServiceName: !ImportValue
            Fn::Sub: ${ServiceStackName}-ECSServiceName
      PolicyType: StepScaling
      ScalingTargetId: !Ref ScalableTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 300
        MetricAggregationType: Maximum
        StepAdjustments:
          - MetricIntervalLowerBound: 0
            ScalingAdjustment: !Ref MaxCPUStepScalingAdjustment

  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ShouldEnableMemoryScaling
    Properties:
      PolicyName: !Sub
        - ${ServiceName}-memory-scaling
        - ServiceName: !ImportValue
            Fn::Sub: ${ServiceStackName}-ECSServiceName
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref MemoryTargetValue
        ScaleInCooldown: !Ref ScaleInCooldown
        ScaleOutCooldown: !Ref ScaleOutCooldown

Outputs:
  ScalableTargetId:
    Description: The scalable target resource ID
    Value: !Ref ScalableTarget
    Export:
      Name: !Sub ${AWS::StackName}-ScalableTarget

  CPUPolicyArn:
    Description: ARN of the CPU scaling policy (if enabled)
    Condition: ShouldEnableCPUScaling
    Value: !Ref CPUScalingPolicy
    Export:
      Name: !Sub ${AWS::StackName}-CPUPolicy

  MaxCPUPolicyArn:
    Description: ARN of the max CPU step scaling policy (if enabled)
    Condition: ShouldEnableMaxCPUScaling
    Value: !Ref MaxCPUScalingPolicy
    Export:
      Name: !Sub ${AWS::StackName}-MaxCPUPolicy

  MemoryPolicyArn:
    Description: ARN of the memory scaling policy (if enabled)
    Condition: ShouldEnableMemoryScaling
    Value: !Ref MemoryScalingPolicy
    Export:
      Name: !Sub ${AWS::StackName}-MemoryPolicy
