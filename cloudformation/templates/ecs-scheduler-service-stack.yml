AWSTemplateFormatVersion: "2010-09-09"
Description: The template used to create an ECS Scheduler Service .
Parameters:
  ClusterStackName:
    Type: String
    MinLength: "1"
    MaxLength: "255"
    AllowedPattern: ^[a-zA-Z][-a-zA-Z0-9]*$
  ECSServiceName:
    Type: String
    MinLength: "1"
    MaxLength: "255"
    AllowedPattern: ^[a-zA-Z][-a-zA-Z0-9]*$
  TaskDefinitionArn:
    Type: String
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the ECS service
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the stack
  AssignPublicIp:
    Type: String
    AllowedValues:
      - ENABLED
      - DISABLED
    Default: DISABLED
  RDSSecurityGroupId:
    Type: String
    Default: ""
    Description: "Optional RDS Security Group ID. If provided, an ingress rule will be created to allow MySQL access from ECS tasks."
  RDSIngressPort:
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
    Description: "Port for RDS ingress rule. Default is 3306 for MySQL."
  TagDomain:
    Type: String
  TagClass:
    Type: String
    AllowedValues:
      - primary
      - secondary
      - utility
  TagEnv:
    Type: String
    AllowedValues:
      - production
      - staging
Conditions:
  HasRDSSecurityGroup: !Not [!Equals [!Ref RDSSecurityGroupId, ""]]
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Common security group for ${ECSServiceName}.
      GroupName: !Sub ${ECSServiceName}-task-sg
      SecurityGroupEgress:
        - Description: Allow all outbound traffic
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: domain
          Value: !Ref TagDomain
        - Key: class
          Value: !Ref TagClass
        - Key: env
          Value: !Ref TagEnv
        - Key: Name
          Value: !Sub ${ECSServiceName}-task-sg
      VpcId: !Ref VpcId

  RDSIngressFromECSTask:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasRDSSecurityGroup
    Properties:
      GroupId: !Ref RDSSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref RDSIngressPort
      ToPort: !Ref RDSIngressPort
      SourceSecurityGroupId: !Ref SecurityGroup
      Description: !Sub "Allow Database access from ${ECSServiceName} ECS tasks"

  ECSService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !ImportValue
        Fn::Sub: ${ClusterStackName}-Cluster
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Base: 1
          Weight: 1
      TaskDefinition: !Ref TaskDefinitionArn
      ServiceName: !Ref ECSServiceName
      SchedulingStrategy: REPLICA
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets: !Ref SubnetIds
      PlatformVersion: LATEST
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      DeploymentController:
        Type: ECS
      ServiceConnectConfiguration:
        Enabled: false
      Tags:
        - Key: domain
          Value: !Ref TagDomain
        - Key: class
          Value: !Ref TagClass
        - Key: env
          Value: !Ref TagEnv
      EnableECSManagedTags: true
Outputs:
  ClusterName:
    Description: The cluster used to create the service.
    Value: !ImportValue
      Fn::Sub: ${ClusterStackName}-Cluster
  ECSService:
    Description: The created service.
    Value: !Ref ECSService
    Export:
      Name: !Sub ${AWS::StackName}-ECSService
  TaskSecurityGroup:
    Description: The security group for the service tasks.
    Value: !Ref SecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-TaskSG
  ECSServiceName:
    Description: The name of the created service.
    Value: !Ref ECSServiceName
    Export:
      Name: !Sub ${AWS::StackName}-ECSServiceName
